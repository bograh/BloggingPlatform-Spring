spring.application.name=BloggingPlatform-Spring

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.data.mongodb.uri=${MONGO_CONNECTION_STRING}
spring.data.mongodb.database=${MONGO_DATABASE}
spring.jpa.hibernate.ddl-auto=update

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true

springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1
springdoc.show-actuator=false
logging.level.org.mongodb.driver=WARN
logging.level.org.mongodb.driver.cluster=WARN
logging.level.org.mongodb.driver.connection=WARN

logging.level.root=INFO
logging.level.com.bloggingplatform=DEBUG
logging.level.com.bloggingplatform.aspect=INFO
logging.level.com.bloggingplatform.service=DEBUG
logging.level.com.bloggingplatform.repository=DEBUG
logging.level.com.bloggingplatform.controller=INFO
logging.level.org.springframework.security=TRACE